<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory — PokéMonde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="game-wrap">
    <div class="page-head">
      <h1>🃏 Memory Pokémon</h1>
      <p>Retourne les cartes deux par deux et retrouve toutes les paires en un minimum de coups.</p>
    </div>
    <div class="game-bar">
      <select id="size"><option value="6">Facile — 6 paires</option><option value="8" selected>Normal — 8 paires</option><option value="12">Difficile — 12 paires</option><option value="18">Expert — 18 paires</option></select>
      <button class="btn small" id="new">🔁 Nouvelle partie</button>
      <span class="pill">Coups : <b id="moves">0</b></span><span class="pill">⏱️ <b id="time">0</b> s</span><span class="pill">Record : <b id="best">–</b></span>
    </div>
    <div id="rank" class="center" style="margin-bottom:12px"></div>
    <div class="mem-grid" id="grid"></div>
    <div id="result"></div>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/logic.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/online.js"></script>
  <script>
  (function () {
    const { P, art, shuffle, store, confetti, toast } = PK;
    const O = PK.online;
    const $ = id => document.getElementById(id);
    // cards[i] = id du Pokémon (inconnu tant que la carte n'a pas été retournée en partie classée)
    let cards, open, found, moves, t0, timer, lock, G, token = 0;
    $('size').value = store.get('mem:size', '8');
    function start() {
      const n = +$('size').value; store.set('mem:size', String(n));
      token++; G = null;
      cards = O.user ? Array(2 * n).fill(0) : shuffle(P.slice(), Math.random).slice(0, n).flatMap(p => [p.id, p.id]);
      if (!O.user) cards = shuffle(cards);
      open = []; found = new Set(); moves = 0; lock = false; t0 = 0; clearInterval(timer);
      $('moves').textContent = 0; $('time').textContent = 0; $('result').innerHTML = '';
      const b = store.get('mem:best:' + n, null); $('best').textContent = b ? b + ' coups' : '–';
      const cols = n <= 8 ? 4 : 6;
      $('grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      $('grid').innerHTML = cards.map((id, i) => `<div class="mem-card" data-i="${i}"><div class="mem-back"></div><div class="mem-front"><img src="${id ? art(id) : ''}" alt="" loading="eager"></div></div>`).join('');
      $('grid').querySelectorAll('.mem-card').forEach(c => c.onclick = () => flip(+c.dataset.i, c));
    }
    function startTimer() { t0 = Date.now(); timer = setInterval(() => $('time').textContent = Math.floor((Date.now() - t0) / 1000), 500); }
    async function flip(i, el) {
      if (lock || found.has(i) || open.some(o => o.i === i)) return;
      let res = null;
      if (O.user) {
        // Partie classée : c'est le serveur qui révèle chaque carte (impossible de tricher en lisant la page)
        lock = true; const tk = token;
        try {
          if (!G) { G = await O.arcade('memory', { n: cards.length / 2 }); if (tk !== token) return; startTimer(); }
          if (G.ranked) {
            res = await O.call('mem-flip', { session: G.session, i });
            if (tk !== token) return;
            cards[i] = res.id; el.querySelector('img').src = art(res.id);
          } else if (!cards[i]) { lock = false; toast('Partie non classée : recharge la page'); return; }
        } catch (e) { toast(e.message); lock = false; return; }
        lock = false;
      } else if (!t0) startTimer();
      el.classList.add('flip'); open.push({ i, el });
      if (open.length < 2) return;
      moves++; $('moves').textContent = moves;
      const [a, b] = open;
      if (cards[a.i] === cards[b.i]) {
        found.add(a.i); found.add(b.i); a.el.classList.add('found'); b.el.classList.add('found'); open = [];
        if (found.size === cards.length) win(res && res.end);
      } else {
        lock = true;
        setTimeout(() => { a.el.classList.remove('flip'); b.el.classList.remove('flip'); open = []; lock = false; }, 800);
      }
    }
    function win(end) {
      clearInterval(timer); confetti();
      const n = cards.length / 2, key = 'mem:best:' + n, b = store.get(key, null);
      if (!b || moves < b) store.set(key, moves);
      if (end) O.refresh();
      $('result').innerHTML = `<div class="card result-box"><h2>🎉 Bravo !</h2><p>${n} paires en <b>${moves}</b> coups et <b>${Math.floor((Date.now() - t0) / 1000)}</b> s.</p>${O.endHtml(end, 'memory-' + n)}<button class="btn" id="again">🔁 Rejouer</button></div>`;
      $('again').onclick = start;
    }
    $('new').onclick = start; $('size').onchange = start;
    O.rankBanner($('rank'), 'classement au nombre de coups, puis au temps');
    let lastUser;
    O.onChange(u => { const id = u ? u.id : null; if (lastUser !== undefined && id !== lastUser) start(); lastUser = id; });
    O.ready.then(start);
  })();
  </script>
</body>
</html>
